<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make a password hash</title><meta name="robots" content="noindex">
<style>body{font:18px system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px}input,button{font:inherit;padding:8px 12px}code{word-break:break-all;background:#f3f3f3;padding:4px}</style></head>
<body>
<h1>Make a password hash</h1>
<p>Type the new site password. Copy the hash into <code>PW_HASH</code> in <code>js/site.js</code>. Nothing you type leaves this page.</p>
<input id="pw" type="text" autocomplete="off" placeholder="new password"> <button id="go">Hash it</button>
<p id="out"></p>
<script>
var SALT = 'kevin-and-ella-2027', ITER = 200000; // must match js/site.js
document.getElementById('go').onclick = function () {
  var enc = new TextEncoder(), pw = document.getElementById('pw').value.trim().toLowerCase();
  crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits'])
    .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(SALT), iterations: ITER }, k, 256); })
    .then(function (b) {
      var h = Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      document.getElementById('out').innerHTML = 'PW_HASH = <code>' + h + '</code>';
    });
};
</script>
</body></html>
